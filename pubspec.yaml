  animate_do: ^4.2.0
  panara_dialogs: ^0.1.5
  lottie: ^3.3.2
  ftoast: ^2.0.0
  flutter_slider_drawer: ^3.0.2
  
  table_calendar: ^3.1.2 
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6 
  hive_generator: ^2.0.1 
  
  flutter_lints: ^3.0.0 

flutter:
