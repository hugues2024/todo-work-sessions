# pubspec.yaml

name: TodoWork
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.17.3 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2 
  image_picker: ^1.0.4 
  font_awesome_flutter: ^10.12.0
  flutter_local_notifications: ^19.5.0 
  audioplayers: ^6.5.1                  

  flutter_native_splash: ^2.4.0
  cupertino_icons: ^1.0.2
  hive: ^2.0.4
